services:
  authz-lab:
    build: .
    image: kosen-swsec-week06:local
    working_dir: /lab
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8080:5000"
    volumes:
      - ./:/lab
    # PRACTICE build: with no .env the app serves public demo flags (FLAG{..._demo}).
    # These shared demo flags are the expected evidence; nothing is submitted on ctf.zcr.ai.
    environment:
      - FLAG_IDOR
      - FLAG_JWT
    command: python vulnerable_app.py
